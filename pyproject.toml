[project]
name = "tabpfn-researcher"
version = "0.1.0"
description = "Autonomous ML researcher: does TabPFN-3.5 make predictive hypotheses cheaper to test?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai==3.24.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "tabpfn==9.1.0",
    "tabpfn-client==0.6.1",
    "tabulate>=0.10.0",
    "xgboost==3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
